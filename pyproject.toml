[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyric-short"
version = "0.1.0"
description = "Turn an audio file into a 9:16 lyric short with Whisper word timestamps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "imageio-ffmpeg>=0.4.9",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
openai-whisper = ["openai-whisper>=20231117"]

[project.scripts]
lyric-short = "lyric_short.cli:main"

[tool.setuptools]
packages = ["lyric_short"]

[tool.setuptools.package-data]
lyric_short = ["../assets/fonts/*.ttf"]
